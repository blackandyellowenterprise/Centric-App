<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Centric Learning App</title>
    <style>
        body { font-family: Arial; max-width: 900px; margin: 50px auto; padding: 20px; background: #f0f0f0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        button { padding: 12px 24px; margin: 5px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        button:hover { background: #45a049; }
        .result { background: #f9f9f9; padding: 15px; margin-top: 20px; border-radius: 5px; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; }
        input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        .section { margin: 20px 0; padding: 20px; background: #fafafa; border-radius: 5px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Centric Learning Claude Agent</h1>
        <p>AI-Powered Educational Assistant</p>

        <div class="section">
            <h3>Server URL</h3>
            <input type="text" id="apiUrl" value="http://localhost:8000/api/v1" placeholder="Server URL">
            <button onclick="testConnection()">🔗 Test Connection</button>
            <div id="status" style="margin-top: 10px; padding: 10px; background: #fff3cd; border-radius: 5px;">
                Click "Test Connection" to check server
            </div>
        </div>

        <div class="section">
            <h3>⚡ Quick Tests</h3>
            <button onclick="runTest('health')">Health Check</button>
            <button onclick="runTest('subjects')">List Subjects</button>
            <button onclick="runTest('grades')">List Grades</button>
            <button onclick="runTest('standard')">Get Sample Standard</button>
        </div>

        <div class="section">
            <h3>📚 Generate Lesson Plan</h3>
            <label>Subject:</label>
            <select id="subject">
                <option value="ela">English Language Arts</option>
                <option value="math">Math</option>
                <option value="science">Science</option>
                <option value="social_studies">Social Studies</option>
            </select>
            <label>Grade:</label>
            <select id="grade">
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
            </select>
            <label>Standard Code:</label>
            <input type="text" id="code" value="ELA06.RLa">
            <label>Duration (minutes):</label>
            <input type="number" id="duration" value="45">
            <button onclick="generateLesson()">Generate Lesson Plan</button>
        </div>

        <div class="section">
            <h3>💬 Ask AI Teacher Assistant</h3>
            <textarea id="question" rows="3" placeholder="Ask any teaching question...">How can I help struggling readers?</textarea>
            <button onclick="askAI()">Ask Question</button>
        </div>

        <div class="section">
            <h3>✅ Assess Student Work</h3>
            <label>Standard Code:</label>
            <input type="text" id="assessCode" value="ELA06.RLa">
            <label>Student Work:</label>
            <textarea id="studentWork" rows="4">The character shows bravery when he saves his friend.</textarea>
            <button onclick="assessWork()">Assess Work</button>
        </div>

        <div id="result" class="result" style="display:none;"></div>
    </div>

    <script>
        let API = 'http://localhost:8000/api/v1';

        function updateAPI() {
            API = document.getElementById('apiUrl').value;
        }

        function showResult(data) {
            const el = document.getElementById('result');
            el.style.display = 'block';
            el.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
            el.scrollIntoView({ behavior: 'smooth' });
        }

        function showLoading(msg) {
            const el = document.getElementById('result');
            el.style.display = 'block';
            el.textContent = msg + '...';
        }

        async function testConnection() {
            updateAPI();
            const status = document.getElementById('status');
            status.textContent = 'Testing...';
            status.style.background = '#fff3cd';

            try {
                const res = await fetch(`${API}/health`);
                const data = await res.json();
                if (res.ok) {
                    status.textContent = '✅ Connected to server!';
                    status.style.background = '#d4edda';
                    showResult(data);
                } else {
                    status.textContent = '❌ Server error';
                    status.style.background = '#f8d7da';
                }
            } catch (e) {
                status.textContent = '❌ Cannot connect - Check URL and make sure server is running';
                status.style.background = '#f8d7da';
                showResult({error: e.message, help: 'Try: http://localhost:8000/api/v1 or http://127.0.0.1:8000/api/v1'});
            }
        }

        async function runTest(type) {
            updateAPI();
            showLoading('Loading');
            try {
                let url;
                if (type === 'health') url = `${API}/health`;
                else if (type === 'subjects') url = `${API}/subjects`;
                else if (type === 'grades') url = `${API}/grades`;
                else if (type === 'standard') url = `${API}/standard/ELA06.RLa`;

                const res = await fetch(url);
                const data = await res.json();
                showResult(data);
            } catch (e) {
                showResult({error: e.message});
            }
        }

        async function generateLesson() {
            updateAPI();
            showLoading('Generating lesson plan (10-20 seconds)');
            try {
                const res = await fetch(`${API}/lesson-plan`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        subject: document.getElementById('subject').value,
                        grade: parseInt(document.getElementById('grade').value),
                        strand_codes: [document.getElementById('code').value],
                        duration_minutes: parseInt(document.getElementById('duration').value)
                    })
                });
                const data = await res.json();
                showResult(data.lesson_plan || data);
            } catch (e) {
                showResult({error: e.message});
            }
        }

        async function askAI() {
            updateAPI();
            showLoading('Asking AI (5-10 seconds)');
            try {
                const question = document.getElementById('question').value;
                const res = await fetch(`${API}/chat?query=${encodeURIComponent(question)}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await res.json();
                showResult(data.response || data);
            } catch (e) {
                showResult({error: e.message});
            }
        }

        async function assessWork() {
            updateAPI();
            showLoading('Assessing work (5-10 seconds)');
            try {
                const res = await fetch(`${API}/assess`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        subject: document.getElementById('subject').value,
                        grade: parseInt(document.getElementById('grade').value),
                        strand_code: document.getElementById('assessCode').value,
                        student_work: document.getElementById('studentWork').value
                    })
                });
                const data = await res.json();
                showResult(data);
            } catch (e) {
                showResult({error: e.message});
            }
        }
    </script>
</body>
</html>
